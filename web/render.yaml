services:
  - type: web
    name: agropredict-climate-mcp
    runtime: node
    plan: free
    rootDir: web
    buildCommand: npm ci && npm run build
    startCommand: node server.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '24.19.0'
      - key: AGROPREDICT_PUBLIC_DEMO
        value: 'true'
      - key: AGROPREDICT_FEEDBACK_ORIGIN
        value: 'https://agropredict.app'
